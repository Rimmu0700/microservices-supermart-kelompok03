# =============================================================================================
# docker-compose.member-3-inventory.yml  -  UJI MANDIRI domain Inventory (Anggota 3)
# Hanya menjalankan: RabbitMQ + database dan service milik domain ini (inventory-service, procurement-service, notification-worker).
# Service lain belum ada di branch ini, jadi tarikan replika/gRPC ke service lain akan gagal dan dicoba ulang
# (itu normal pada uji mandiri). Yang diuji di sini: build, healthcheck, koneksi DB, koneksi RabbitMQ.
# Sesuai isolasi Tugas 5: tidak ada port host untuk service maupun database.
#
#   docker compose -f docker-compose.member-3-inventory.yml up --build -d
#   docker compose -f docker-compose.member-3-inventory.yml ps
#   docker compose -f docker-compose.member-3-inventory.yml down -v
# =============================================================================================

services:
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: nusantara-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: nusantara_mq
      RABBITMQ_DEFAULT_PASS: nusantara_mq_secret
      RABBITMQ_DEFAULT_VHOST: /supermart
    ports:
    - 127.0.0.1:15672:15672
    volumes:
    - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test:
      - CMD
      - rabbitmq-diagnostics
      - -q
      - ping
      interval: 10s
      timeout: 10s
      retries: 10
  inventory-db:
    image: mysql:8.0
    container_name: nusantara-inventory-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root_secret
      MYSQL_DATABASE: inventory_db
      MYSQL_USER: inventory_user
      MYSQL_PASSWORD: inventory_secret
    command:
    - --default-authentication-plugin=mysql_native_password
    - --innodb-buffer-pool-size=64M
    - --performance-schema=OFF
    - --max-connections=60
    volumes:
    - ./services/inventory-service/db/schema.sql:/docker-entrypoint-initdb.d/10-schema.sql:ro
    - inventory_db_data:/var/lib/mysql
    healthcheck:
      test:
      - CMD
      - mysqladmin
      - ping
      - -h
      - 127.0.0.1
      - -u
      - root
      - -proot_secret
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 40s
  procurement-db:
    image: mysql:8.0
    container_name: nusantara-procurement-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root_secret
      MYSQL_DATABASE: procurement_db
      MYSQL_USER: procurement_user
      MYSQL_PASSWORD: procurement_secret
    command:
    - --default-authentication-plugin=mysql_native_password
    - --innodb-buffer-pool-size=64M
    - --performance-schema=OFF
    - --max-connections=60
    volumes:
    - ./services/procurement-service/db/schema.sql:/docker-entrypoint-initdb.d/10-schema.sql:ro
    - procurement_db_data:/var/lib/mysql
    healthcheck:
      test:
      - CMD
      - mysqladmin
      - ping
      - -h
      - 127.0.0.1
      - -u
      - root
      - -proot_secret
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 40s
  notification-db:
    image: mysql:8.0
    container_name: nusantara-notification-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root_secret
      MYSQL_DATABASE: notification_db
      MYSQL_USER: notification_user
      MYSQL_PASSWORD: notification_secret
    command:
    - --default-authentication-plugin=mysql_native_password
    - --innodb-buffer-pool-size=64M
    - --performance-schema=OFF
    - --max-connections=60
    volumes:
    - ./services/notification-worker/db/schema.sql:/docker-entrypoint-initdb.d/10-schema.sql:ro
    - notification_db_data:/var/lib/mysql
    healthcheck:
      test:
      - CMD
      - mysqladmin
      - ping
      - -h
      - 127.0.0.1
      - -u
      - root
      - -proot_secret
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 40s
  inventory-service:
    restart: unless-stopped
    depends_on:
      inventory-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    build:
      context: ./services/inventory-service
    container_name: inventory-service
    environment:
      MYSQL_HOST: inventory-db
      MYSQL_PORT: '3306'
      APP_PORT: '3000'
      APP_ENV: production
      JWT_SECRET: supermart-secret-key-for-nusantara-course-2026
      JWT_EXPIRY: 24h
      CORS_ORIGINS: http://localhost:4200,http://127.0.0.1:4200,http://localhost:3000
      AMQP_URI: amqp://nusantara_mq:nusantara_mq_secret@rabbitmq:5672/%2Fsupermart
      INTERNAL_TOKEN: supermart-internal-token-2026
      REPLICA_INTERVAL_SECONDS: '3'
      AUTH_URL: http://auth-service:3000
      CATALOG_URL: http://catalog-service:3000
      CATALOG_GRPC_ADDR: catalog-service:50051
      INVENTORY_URL: http://inventory-service:3000
      ORDER_URL: http://order-service:3000
      MYSQL_DATABASE: inventory_db
      MYSQL_USER: inventory_user
      MYSQL_PASSWORD: inventory_secret
    expose:
    - '3000'
  procurement-service:
    restart: unless-stopped
    depends_on:
      procurement-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    build:
      context: ./services/procurement-service
    container_name: procurement-service
    environment:
      MYSQL_HOST: procurement-db
      MYSQL_PORT: '3306'
      APP_PORT: '3000'
      APP_ENV: production
      JWT_SECRET: supermart-secret-key-for-nusantara-course-2026
      JWT_EXPIRY: 24h
      CORS_ORIGINS: http://localhost:4200,http://127.0.0.1:4200,http://localhost:3000
      AMQP_URI: amqp://nusantara_mq:nusantara_mq_secret@rabbitmq:5672/%2Fsupermart
      INTERNAL_TOKEN: supermart-internal-token-2026
      REPLICA_INTERVAL_SECONDS: '3'
      AUTH_URL: http://auth-service:3000
      CATALOG_URL: http://catalog-service:3000
      CATALOG_GRPC_ADDR: catalog-service:50051
      INVENTORY_URL: http://inventory-service:3000
      ORDER_URL: http://order-service:3000
      MYSQL_DATABASE: procurement_db
      MYSQL_USER: procurement_user
      MYSQL_PASSWORD: procurement_secret
    expose:
    - '3000'
  notification-worker:
    restart: unless-stopped
    depends_on:
      notification-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    build:
      context: ./services/notification-worker
    container_name: notification-worker
    environment:
      MYSQL_HOST: notification-db
      MYSQL_PORT: '3306'
      APP_PORT: '3000'
      APP_ENV: production
      JWT_SECRET: supermart-secret-key-for-nusantara-course-2026
      JWT_EXPIRY: 24h
      CORS_ORIGINS: http://localhost:4200,http://127.0.0.1:4200,http://localhost:3000
      AMQP_URI: amqp://nusantara_mq:nusantara_mq_secret@rabbitmq:5672/%2Fsupermart
      INTERNAL_TOKEN: supermart-internal-token-2026
      REPLICA_INTERVAL_SECONDS: '3'
      AUTH_URL: http://auth-service:3000
      CATALOG_URL: http://catalog-service:3000
      CATALOG_GRPC_ADDR: catalog-service:50051
      INVENTORY_URL: http://inventory-service:3000
      ORDER_URL: http://order-service:3000
      MYSQL_DATABASE: notification_db
      MYSQL_USER: notification_user
      MYSQL_PASSWORD: notification_secret
volumes:
  rabbitmq_data:
  inventory_db_data:
  procurement_db_data:
  notification_db_data:
