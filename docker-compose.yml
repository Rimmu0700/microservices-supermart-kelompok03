# =============================================================================================
# docker-compose.yml - SEMUA SERVICE MANDIRI
#   * tiap service dibangun dari folder sendiri (services/<nama>/ : go.mod, Dockerfile, kode, db/schema.sql)
#   * tiap service punya CONTAINER DATABASE, VOLUME, port host, dan kredensial sendiri
#   * tidak ada kode, modul Go, Dockerfile, maupun database yang dipakai bersama
#   * Tugas 5: HANYA api-gateway (KrakenD :8000) dan frontend (:4200) yang membuka port ke klien; service dan database
#     hanya 'expose' di jaringan Docker; konsol RabbitMQ (ops) hanya di 127.0.0.1:15672
#
#   docker compose down -v      # matikan stack lama dulu (nama container sama)
#   docker compose -f docker-compose.yml up --build -d
#   docker compose -f docker-compose.yml ps
# Memori: 10 container MySQL + 10 service Go ~ 4-5 GB RAM; beri Docker minimal 8 GB.
# =============================================================================================

services:
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: nusantara-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: nusantara_mq
      RABBITMQ_DEFAULT_PASS: nusantara_mq_secret
      RABBITMQ_DEFAULT_VHOST: /supermart
    ports:
    - 127.0.0.1:15672:15672
    volumes:
    - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test:
      - CMD
      - rabbitmq-diagnostics
      - -q
      - ping
      interval: 10s
      timeout: 10s
      retries: 10
  auth-db:
    image: mysql:8.0
    container_name: nusantara-auth-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root_secret
      MYSQL_DATABASE: auth_db
      MYSQL_USER: auth_user
      MYSQL_PASSWORD: auth_secret
    command:
    - --default-authentication-plugin=mysql_native_password
    - --innodb-buffer-pool-size=64M
    - --performance-schema=OFF
    - --max-connections=60
    volumes:
    - ./services/auth-service/db/schema.sql:/docker-entrypoint-initdb.d/10-schema.sql:ro
    - auth_db_data:/var/lib/mysql
    healthcheck:
      test:
      - CMD
      - mysqladmin
      - ping
      - -h
      - 127.0.0.1
      - -u
      - root
      - -proot_secret
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 40s
