services:
  mysql:
    image: mysql:8.0
    container_name: nusantara-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root_secret
      MYSQL_DATABASE: nusantara_db
      MYSQL_USER: nusantara_user
      MYSQL_PASSWORD: nusantara_secret
    ports:
      - "3306:3306"
    volumes:
      - ./db.sql:/docker-entrypoint-initdb.d/01-db.sql:ro
      - ./seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
      - ./deployments/sql/03-messaging.sql:/docker-entrypoint-initdb.d/03-messaging.sql:ro
      - mysql_data:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot_secret" ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: nusantara-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: nusantara_mq
      RABBITMQ_DEFAULT_PASS: nusantara_mq_secret
      RABBITMQ_DEFAULT_VHOST: /supermart
    ports:
      - "5672:5672" # AMQP 0-9-1
      - "15672:15672" # Management Dashboard
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "-q", "ping" ]
      interval: 10s
      timeout: 10s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nusantara-backend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: nusantara_db
      MYSQL_USER: nusantara_user
      MYSQL_PASSWORD: nusantara_secret
      APP_PORT: 3000
      APP_ENV: production
      JWT_SECRET: supermart-secret-key-for-nusantara-course-2026
      JWT_EXPIRY: 24h
      CORS_ORIGINS: "http://localhost:4200,http://127.0.0.1:4200,http://localhost:3000"
      AMQP_URI: "amqp://nusantara_mq:nusantara_mq_secret@rabbitmq:5672/%2Fsupermart"
    depends_on:
      mysql:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: nusantara-frontend
    restart: unless-stopped
    ports:
      - "4200:80"
    depends_on:
      - backend

volumes:
  mysql_data:
  rabbitmq_data:
