# API Gateway: satu pintu masuk untuk frontend, meneruskan request ke service berdasarkan prefix path.
# Alamat service di-resolve saat request (bukan saat nginx start) agar gateway tetap hidup walau
# sebagian service belum siap.
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 8080;
    client_max_body_size 10m;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;

    location = /api/v1/health {
        default_type application/json;
        return 200 '{"success":true,"message":"API Gateway is operational"}';
    }

    location /api/v1/auth        { set $up http://auth-service:3000;        proxy_pass $up; }
    location /api/v1/catalog     { set $up http://catalog-service:3000;     proxy_pass $up; }
    location /api/v1/inventory   { set $up http://inventory-service:3000;   proxy_pass $up; }
    location /api/v1/orders      { set $up http://order-service:3000;       proxy_pass $up; }
    location /api/v1/payments    { set $up http://payment-service:3000;     proxy_pass $up; }
    location /api/v1/promotions  { set $up http://promotion-service:3000;   proxy_pass $up; }
    location /api/v1/logistics   { set $up http://logistics-service:3000;   proxy_pass $up; }
    location /api/v1/procurement { set $up http://procurement-service:3000; proxy_pass $up; }
    location /api/v1/support     { set $up http://support-service:3000;     proxy_pass $up; }

    # Endpoint /internal/* hanya untuk antar service di jaringan Docker, tidak pernah dibuka ke luar
    location /internal/ { return 404; }
    location / { return 404; }
}