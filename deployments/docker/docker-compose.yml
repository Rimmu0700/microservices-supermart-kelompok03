services:
  order-db:
    image: postgres:15-alpine
    container_name: supermart-order-db
    restart: always
    environment:
      POSTGRES_DB: order_service_db
      POSTGRES_USER: order_admin
      POSTGRES_PASSWORD: order_secret_pass
    # Isolasi port mutlak untuk Order Service
    ports:
      - "5434:5432"
    volumes:
      - order_db_data:/var/lib/postgresql/data
      - ./init-scripts/order:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U order_admin -d order_service_db" ]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - supermart-network

  identity-db:
    image: mysql:8.0
    container_name: supermart-identity-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: identity_root_pass
      MYSQL_DATABASE: identity_service_db
      MYSQL_USER: identity_admin
      MYSQL_PASSWORD: identity_secret_pass
    # Isolasi port mutlak untuk Identity Service
    # (3306 sudah dipakai MySQL monolith nusantara_db, jadi host port = 3307)
    ports:
      - "3307:3306"
    volumes:
      - identity_db_data:/var/lib/mysql
      - ./init-scripts/identity:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "identity_admin", "-pidentity_secret_pass" ]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - supermart-network

networks:
  supermart-network:
    driver: bridge
    name: supermart-isolated-net

volumes:
  order_db_data:
  identity_db_data:
