# =============================================================================================
# docker-compose.member-4-order.yml  -  UJI MANDIRI domain Order (Anggota 4)
# Hanya menjalankan: RabbitMQ + database dan service milik domain ini (order-service, payment-service, logistics-service).
# Service lain belum ada di branch ini, jadi tarikan replika/gRPC ke service lain akan gagal dan dicoba ulang
# (itu normal pada uji mandiri). Yang diuji di sini: build, healthcheck, koneksi DB, koneksi RabbitMQ.
# Sesuai isolasi Tugas 5: tidak ada port host untuk service maupun database.
#
#   docker compose -f docker-compose.member-4-order.yml up --build -d
#   docker compose -f docker-compose.member-4-order.yml ps
#   docker compose -f docker-compose.member-4-order.yml down -v
# =============================================================================================

services:
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: nusantara-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: nusantara_mq
      RABBITMQ_DEFAULT_PASS: nusantara_mq_secret
      RABBITMQ_DEFAULT_VHOST: /supermart
    ports:
    - 127.0.0.1:15672:15672
    volumes:
    - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test:
      - CMD
      - rabbitmq-diagnostics
      - -q
      - ping
      interval: 10s
      timeout: 10s
      retries: 10
  order-db:
    image: mysql:8.0
    container_name: nusantara-order-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root_secret
      MYSQL_DATABASE: order_db
      MYSQL_USER: order_user
      MYSQL_PASSWORD: order_secret
    command:
    - --default-authentication-plugin=mysql_native_password
    - --innodb-buffer-pool-size=64M
    - --performance-schema=OFF
    - --max-connections=60
    volumes:
    - ./services/order-service/db/schema.sql:/docker-entrypoint-initdb.d/10-schema.sql:ro
    - order_db_data:/var/lib/mysql
    healthcheck:
      test:
      - CMD
      - mysqladmin
      - ping
      - -h
      - 127.0.0.1
      - -u
      - root
      - -proot_secret
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 40s
  payment-db:
    image: mysql:8.0
    container_name: nusantara-payment-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root_secret
      MYSQL_DATABASE: payment_db
      MYSQL_USER: payment_user
      MYSQL_PASSWORD: payment_secret
    command:
    - --default-authentication-plugin=mysql_native_password
    - --innodb-buffer-pool-size=64M
    - --performance-schema=OFF
    - --max-connections=60
    volumes:
    - ./services/payment-service/db/schema.sql:/docker-entrypoint-initdb.d/10-schema.sql:ro
    - payment_db_data:/var/lib/mysql
    healthcheck:
      test:
      - CMD
      - mysqladmin
      - ping
      - -h
      - 127.0.0.1
      - -u
      - root
      - -proot_secret
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 40s
  logistics-db:
    image: mysql:8.0
    container_name: nusantara-logistics-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root_secret
      MYSQL_DATABASE: logistics_db
      MYSQL_USER: logistics_user
      MYSQL_PASSWORD: logistics_secret
    command:
    - --default-authentication-plugin=mysql_native_password
    - --innodb-buffer-pool-size=64M
    - --performance-schema=OFF
    - --max-connections=60
    volumes:
    - ./services/logistics-service/db/schema.sql:/docker-entrypoint-initdb.d/10-schema.sql:ro
    - logistics_db_data:/var/lib/mysql
    healthcheck:
      test:
      - CMD
      - mysqladmin
      - ping
      - -h
      - 127.0.0.1
      - -u
      - root
      - -proot_secret
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 40s
  order-service:
    restart: unless-stopped
    depends_on:
      order-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    build:
      context: ./services/order-service
    container_name: order-service
    environment:
      MYSQL_HOST: order-db
      MYSQL_PORT: '3306'
      APP_PORT: '3000'
      APP_ENV: production
      JWT_SECRET: supermart-secret-key-for-nusantara-course-2026
      JWT_EXPIRY: 24h
      CORS_ORIGINS: http://localhost:4200,http://127.0.0.1:4200,http://localhost:3000
      AMQP_URI: amqp://nusantara_mq:nusantara_mq_secret@rabbitmq:5672/%2Fsupermart
      INTERNAL_TOKEN: supermart-internal-token-2026
      REPLICA_INTERVAL_SECONDS: '3'
      AUTH_URL: http://auth-service:3000
      CATALOG_URL: http://catalog-service:3000
      CATALOG_GRPC_ADDR: catalog-service:50051
      INVENTORY_URL: http://inventory-service:3000
      ORDER_URL: http://order-service:3000
      MYSQL_DATABASE: order_db
      MYSQL_USER: order_user
      MYSQL_PASSWORD: order_secret
    expose:
    - '3000'
  payment-service:
    restart: unless-stopped
    depends_on:
      payment-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    build:
      context: ./services/payment-service
    container_name: payment-service
    environment:
      MYSQL_HOST: payment-db
      MYSQL_PORT: '3306'
      APP_PORT: '3000'
      APP_ENV: production
      JWT_SECRET: supermart-secret-key-for-nusantara-course-2026
      JWT_EXPIRY: 24h
      CORS_ORIGINS: http://localhost:4200,http://127.0.0.1:4200,http://localhost:3000
      AMQP_URI: amqp://nusantara_mq:nusantara_mq_secret@rabbitmq:5672/%2Fsupermart
      INTERNAL_TOKEN: supermart-internal-token-2026
      REPLICA_INTERVAL_SECONDS: '3'
      AUTH_URL: http://auth-service:3000
      CATALOG_URL: http://catalog-service:3000
      CATALOG_GRPC_ADDR: catalog-service:50051
      INVENTORY_URL: http://inventory-service:3000
      ORDER_URL: http://order-service:3000
      MYSQL_DATABASE: payment_db
      MYSQL_USER: payment_user
      MYSQL_PASSWORD: payment_secret
    expose:
    - '3000'
  logistics-service:
    restart: unless-stopped
    depends_on:
      logistics-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    build:
      context: ./services/logistics-service
    container_name: logistics-service
    environment:
      MYSQL_HOST: logistics-db
      MYSQL_PORT: '3306'
      APP_PORT: '3000'
      APP_ENV: production
      JWT_SECRET: supermart-secret-key-for-nusantara-course-2026
      JWT_EXPIRY: 24h
      CORS_ORIGINS: http://localhost:4200,http://127.0.0.1:4200,http://localhost:3000
      AMQP_URI: amqp://nusantara_mq:nusantara_mq_secret@rabbitmq:5672/%2Fsupermart
      INTERNAL_TOKEN: supermart-internal-token-2026
      REPLICA_INTERVAL_SECONDS: '3'
      AUTH_URL: http://auth-service:3000
      CATALOG_URL: http://catalog-service:3000
      CATALOG_GRPC_ADDR: catalog-service:50051
      INVENTORY_URL: http://inventory-service:3000
      ORDER_URL: http://order-service:3000
      MYSQL_DATABASE: logistics_db
      MYSQL_USER: logistics_user
      MYSQL_PASSWORD: logistics_secret
    expose:
    - '3000'
volumes:
  rabbitmq_data:
  order_db_data:
  payment_db_data:
  logistics_db_data:
